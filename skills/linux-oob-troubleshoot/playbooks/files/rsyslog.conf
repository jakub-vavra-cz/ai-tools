# idmci OOB collector (podman) — high port avoids NET_BIND_SERVICE
global(workDirectory="/var/lib/rsyslog")

module(load="imudp")
input(type="imudp" port="5514")

module(load="imtcp")
input(type="imtcp" port="5514")

module(load="builtin:omfile")

template(name="RemoteHost" type="string"
         string="/var/log/remote/%HOSTNAME%/%PROGRAMNAME%.log")
template(name="RemoteAll" type="string"
         string="/var/log/remote/%HOSTNAME%/messages")

*.* action(type="omfile" dynaFile="RemoteHost")
*.* action(type="omfile" dynaFile="RemoteAll")
