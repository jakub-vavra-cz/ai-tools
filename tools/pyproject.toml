[project]
name = "ai-tools"
version = "0.1.0"
description = "CLI helpers from the ai-tools repository"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
]

[project.scripts]
clean-twd = "ai_tools.clean_twd:main"
pull-jenkins-artifacts = "ai_tools.jenkins_artifacts:main"
check-ansible = "ai_tools.check_ansible:main"
check-python = "ai_tools.check_python:main"
dump-polarion-testcase = "ai_tools.dump_polarion_testcase:main"
import-jira-testcase = "ai_tools.import_jira_testcase:main"
scan-python-testcase = "ai_tools.scan_python_testcase:main"
beetlejuice = "ai_tools.beetlejuice:main"
is-merged = "ai_tools.is_merged:main"
clone-review = "ai_tools.clone_review:main"
review-diff = "ai_tools.review_diff:main"
cleanup-review = "ai_tools.cleanup_review:main"
review-pr = "ai_tools.review_pr:main"
sync-twd-tests = "ai_tools.sync_twd_tests:main"
brew-fetch-nvr = "ai_tools.brew_fetch_nvr:main"
twd-rpm = "ai_tools.twd_rpm:main"
te-test-summary = "ai_tools.te_test_summary:main"
run-idm-jenkins = "ai_tools.run_idm_jenkins:main"
decompress-logs = "ai_tools.decompress_logs:main"
jenkins-to-testrun = "ai_tools.jenkins_to_testrun:main"
artifact-grep = "ai_tools.artifact_grep:main"
idmci-rerun-failed = "ai_tools.idmci_rerun_failed:main"

[project.optional-dependencies]
polarion-yaml = ["PyYAML>=6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_tools*"]
